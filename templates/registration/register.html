<!doctype html>
<html>
  <head>
    {% load static %}
    <title>Laboratório Cultural — Registo</title>

    <link
      rel="icon"
      type="image/ico"
      href="{% static 'images/favicon.ico' %}"
    />

    <link rel="stylesheet" href="{% static 'css/global.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  </head>

  <body>
    <div class="container">
      <header>
        <img
          src="{% static 'images/ispgaya-logo.png' %}"
          alt="Logótipo"
          width="180"
        />
      </header>

      <main>
        <div class="section-wrapper">
          <section>
            <h1>Criar conta<br />Laboratório Cultural</h1>

            <form method="POST">
              {% csrf_token %}

              <input
                type="email"
                name="email"
                placeholder="email@exemplo.com"
                required
              />

              <input
                type="password"
                name="password"
                placeholder="Palavra-passe"
                required
              />

              <input
                type="password"
                name="password_confirm"
                placeholder="Confirmar palavra-passe"
                required
              />

              {% if error %}
              <p style="color: red">{{ error }}</p>
              {% endif %}

              <button type="submit">Criar conta</button>
            </form>

            <p style="margin-top: 12px">
              Já tens conta?
              <a href="/login/">Fazer login</a>
            </p>
          </section>
        </div>
      </main>

      <footer>
        <span>2026 · ISPGAYA</span>
      </footer>
    </div>
  </body>
</html>
